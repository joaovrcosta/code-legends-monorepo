name: Expire subscriptions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  expire-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-subscriptions job
        run: |
          curl -sf -X POST \
            --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.JOBS_SECRET }}" \
            "${{ vars.API_URL }}/internal/jobs/expire-subscriptions"
